name: Build Release APK

on:
  push:
    branches:
      - main

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          set -euo pipefail

          ./gradlew assembleRelease --no-daemon

          APK_PATH=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n1)

          if [[ -z "$APK_PATH" ]]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi

          cp "$APK_PATH" "LiturgX-unsigned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: "LiturgX-unsigned"
          path: "LiturgX-unsigned.apk"
          if-no-files-found: error
