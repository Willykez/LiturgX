name: Build APK (CI)

# Runs on every push, to any branch, so a broken build is caught immediately instead of only
# being discovered the next time someone pushes a "v*" tag. Builds just the signed release
# APK -- no AAB, no GitHub Release -- for fast feedback plus a downloadable APK for quick
# manual testing from the Actions tab.
#
# Tag pushes are excluded here (tags-ignore) so pushing "v1.2" doesn't trigger this workflow
# too, on top of release.yml -- that one already covers tags, with the fuller APK + AAB +
# GitHub Release flow. These two workflows are meant to run side by side, not overlap:
#   - This one:      every push (not a tag)  -> signed APK only, artifact upload only.
#   - release.yml:   push of a "v*" tag      -> signed APK + AAB, plus a GitHub Release.
#     (release.yml also supports workflow_dispatch for an on-demand signed build with no tag.)
on:
  push:
    tags-ignore:
      - "**"
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same project-root discovery as release.yml -- see the comment there for why this can't
      # just be a hardcoded path.
      - name: Locate Gradle project root
        id: proj
        run: |
          GRADLEW_PATH=$(find . -maxdepth 3 -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "::error::Couldn't find a gradlew anywhere in the checkout (searched 3 levels deep)."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Same four repository secrets release.yml uses (KEYSTORE_B64, KEY_ALIAS, KEY_PASSWORD,
      # STORE_PASSWORD) -- every push gets a properly signed APK, not a separate debug-signed
      # one, so what you download here is the same signing identity the tagged release uses.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.proj.outputs.dir }}
        run: chmod +x gradlew

      - name: Build signed release APK
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: liturgx-apk-${{ github.run_number }}
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
